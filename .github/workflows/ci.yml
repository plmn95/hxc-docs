name: Validate documentation

# Run PR checks locally. Dispatch CI only after explicit authorization for that PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate and build
        run: npm run check
      - name: Verify suggestions service
        run: npm run test:suggestions && npm run suggestions:check
      - name: Verify frozen manuals
        run: npm run test:archives
      - name: Install browser for editor checks
        run: npx playwright install --with-deps chromium
      - name: Verify full-page editor and complete Markdown corpus
        run: npm run test:editor
